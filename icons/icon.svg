<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#261014"/>
      <stop offset="60%" stop-color="#11090b"/>
      <stop offset="100%" stop-color="#080506"/>
    </radialGradient>
    <linearGradient id="diamondGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0444e"/>
      <stop offset="50%" stop-color="#d92f39"/>
      <stop offset="100%" stop-color="#75111b"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f4e9dc"/>
      <stop offset="100%" stop-color="#d6a05d"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="96" fill="url(#bgGrad)"/>
  <rect x="16" y="16" width="480" height="480" rx="80" fill="none" stroke="#562127" stroke-width="4"/>
  <polygon points="256,64 432,256 256,448 80,256" fill="none" stroke="#d6a05d" stroke-width="6" opacity="0.4"/>
  <g filter="url(#glow)">
    <polygon points="256,96 400,256 256,416 112,256" fill="url(#diamondGrad)"/>
    <polygon points="256,160 336,256 256,352 176,256" fill="#11090b" stroke="url(#goldGrad)" stroke-width="5"/>
    <circle cx="256" cy="256" r="32" fill="url(#goldGrad)"/>
  </g>
</svg>